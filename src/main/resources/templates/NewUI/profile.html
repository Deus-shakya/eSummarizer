<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile</title>
    <link rel="shortcut icon" href="/logo/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="/NewUI/CSS/navbar.css" />
    <link rel="stylesheet" href="/NewUI/CSS/profile.css" />
  </head>
  <body>
    <div th:replace="NewUI/navbar :: navbar"></div>
    <section class="hero-section">
      <div class="hero-content">
        <h1 class="hero-title">Your Profile</h1>
        <p class="hero-subtitle">Manage your account settings.</p>
      </div>
    </section>

    <div class="profile-container">
      <div class="profile-card">
        <div class="profile-header">
          <div class="profile-avatar" id="avatar">
            <div class="avatar-wrapper">
              <img
                id="profileImage"
                src="default.jpg"
                alt="Profile Image"
                style="
                  width: 100%;
                  height: 100%;
                  border-radius: 50%;
                  cursor: pointer;
                "
                onclick="openAvatarModal()"
              />
              <span class="avatar-tooltip">Change Avatar</span>
            </div>
          </div>
          <div class="profile-info">
            <h1 id="displayName">------</h1>
            <p id="displayEmail">----------</p>
            <p id="displayDate">------------------</p>
            <div class="profile-stats">
              <div class="stat">
                <div class="stat-number" id="summarycount"></div>
                <div class="stat-label">Documents Summarized</div>
              </div>
              <div class="stat">
                <div class="stat-number" id="wordcount"></div>
                <div class="stat-label">Words Processed</div>
              </div>
              <div class="stat">
                <div class="stat-number" id="hours"></div>
                <div class="stat-label">Hours Saved</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="section-card">
        <div
          class="section-header"
          id="accountHeader"
          onclick="toggleAccountForm()"
        >
          <h2 class="section-title">
            <div class="title-left">Account Information</div>
            <span class="dropdown-arrow">▼</span>
          </h2>
        </div>
        <div class="form-content" id="accountFormContent">
          <form id="profileForm" class="enhanced-form">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="firstname"> First Name </label>
                <input
                  type="text"
                  id="firstname"
                  name="firstname"
                  class="form-input"
                  value=""
                  placeholder="Enter your first name"
                />
              </div>
              <div class="form-group">
                <label class="form-label" for="middlename"> Middle Name </label>
                <input
                  type="text"
                  id="middlename"
                  name="middlename"
                  class="form-input"
                  placeholder="Enter your middle name (optional)"
                />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="lastname"> Last Name </label>
                <input
                  type="text"
                  id="lastname"
                  name="lastname"
                  class="form-input"
                  value=""
                  placeholder="Enter your last name"
                />
              </div>
              <div class="form-group">
                <label class="form-label" for="username"> Username </label>
                <input
                  type="text"
                  id="username"
                  name="username"
                  class="form-input"
                  value=""
                  placeholder="Choose a unique username"
                />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="email"> Email Address </label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-input"
                  value=""
                  placeholder="Enter your email address"
                  readonly
                />
              </div>
              <div class="form-group">
                <label class="form-label" for="phone"> Phone Number </label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  class="form-input"
                  value=""
                  placeholder="Enter your phone number"
                />
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="enhanced-btn">Update Profile</button>
            </div>
          </form>
        </div>
      </div>

      <div class="section-card">
        <div
          class="section-header"
          id="passwordHeader"
          onclick="togglePasswordForm()"
        >
          <h2 class="section-title">
            <div class="title-left">Change Password</div>
            <span class="dropdown-arrow">▼</span>
          </h2>
        </div>
        <div class="form-content" id="passwordFormContent">
          <form id="passwordForm" class="enhanced-form">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="currentPassword"
                  >Current Password</label
                >
                <input
                  type="password"
                  id="currentPassword"
                  name="currentPassword"
                  class="form-input"
                  placeholder="Enter current password"
                  required
                  autocomplete="current-password"
                />
              </div>
              <div class="form-group">
                <label class="form-label" for="newPassword">New Password</label>
                <input
                  type="password"
                  id="newPassword"
                  name="newPassword"
                  class="form-input"
                  placeholder="Enter new password"
                  required
                  autocomplete="new-password"
                />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="confirmPassword"
                  >Confirm New Password</label
                >
                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  class="form-input"
                  placeholder="Re-enter new password"
                  required
                  autocomplete="new-password"
                />
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="enhanced-btn">
                Change Password
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="section-card">
        <div
          class="section-header"
          id="othersHeader"
          onclick="toggleOthersForm()"
        >
          <h2 class="section-title">
            <div class="title-left">Others</div>
            <span class="dropdown-arrow">▼</span>
          </h2>
        </div>
        <div class="form-content" id="othersFormContent">
          <form id="othersForm" class="enhanced-form">
            <button
              type="button"
              class="btn-danger enhanced-btn"
              style="
                background: linear-gradient(135deg, #e53935 0%, #e35d5b 100%);
                color: #fff;
              "
              onclick="deleteAccount()"
            >
              Delete Account
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Avatar Edit Modal -->
    <div id="avatarModal" class="modal-overlay">
      <div class="modal-content">
        <h2>Edit Profile Image</h2>
        <form id="avatarForm">
          <div class="modal-img-preview">
            <img id="avatarPreview" src="default.jpg" alt="Preview" />
          </div>
          <input type="file" id="avatarInput" name="avatar" accept="image/*" />
          <div class="modal-actions">
            <button type="submit" class="enhanced-btn">Upload</button>
            <button
              type="button"
              class="enhanced-btn"
              onclick="closeAvatarModal()"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="/NewUI/JS/navbar.js"></script>
    <script src="/NewUI/JS/profile.js"></script>
  </body>
</html>
