<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gistify</title>
    <link rel="shortcut icon" href="/logo/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="/NewUI/CSS/navbar.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar" th:fragment="navbar">
      <div class="nav-container">
        <a href="/NewUI/index" class="nav-logo">
          <span class="nav-logo-text"
            ><strong>G</strong><light>istify</light></span
          >
        </a>
        <!-- hamrbugerb -->
        <div
          class="mobile-menu-toggle"
          id="mobile-menu-toggle"
          aria-label="Open menu"
          tabindex="0"
        >
          <span></span>
          <span></span>
          <span></span>
        </div>

        <ul class="nav-links" id="nav-links">
          <li><a href="/NewUI/index" class="nav-link">Home</a></li>
          <li><a href="/NewUI/features" class="nav-link">Features</a></li>
          <li><a href="/NewUI/about" class="nav-link">About</a></li>
          <li><a href="/NewUI/contact" class="nav-link">Contact</a></li>
          <li>
            <div class="nav-auth">
              <!-- Show Sign Up & Login if NOT logged in -->
              <a
                href="/NewUI/signup"
                class="btn-primary"
                th:if="${not #authorization.expression('isAuthenticated()')}"
                >Sign Up</a
              >
              <a
                href="/NewUI/login"
                class="btn-primary"
                th:if="${not #authorization.expression('isAuthenticated()')}"
                >Login</a
              >
              <!-- Show Profile & Logout if logged in -->
              <a
                href="/NewUI/profile"
                class="btn-primary"
                th:if="${#authorization.expression('isAuthenticated()')}"
                >Profile</a
              >
              <a
                href="/logout"
                class="btn-primary"
                th:if="${#authorization.expression('isAuthenticated()')}"
                >Logout</a
              >
            </div>
          </li>
          <li>
            <button
              id="theme-toggle"
              aria-label="Toggle dark mode"
              class="btn-secondary"
            >
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M5 12H1M23 12h-4M7.05 7.05L4.222 4.222M19.778 19.778L16.95 16.95M7.05 16.95L4.222 19.778M19.778 4.222L16.95 7.05"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
                <circle
                  cx="12"
                  cy="12"
                  r="4"
                  fill="currentColor"
                  fill-opacity="0.16"
                />
                <path
                  d="M12 19v4M12 1v4"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </li>
        </ul>
      </div>
    </nav>
    <script src="/NewUI/JS/navbar.js"></script>
  </body>
</html>
