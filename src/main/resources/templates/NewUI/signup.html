<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - AI Text Summarizer</title>
    <link rel="stylesheet" href="/NewUI/CSS/navbar.css" />
    <link rel="stylesheet" href="/NewUI/CSS/signup.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <div th:replace="NewUI/navbar :: navbar"></div>
    <!-- Auth Container -->
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Create Account</h1>
          <p class="auth-subtitle">
            Start your journey with AI-powered text summarization
          </p>
        </div>

        <form
          class="auth-form"
          enctype="multipart/form-data"
          accept="image/jpeg"
        >
          <div class="form-group">
            <label for="profileImage" style="cursor: pointer">
              <img
                id="profilePreview"
                src="/NewUI/Images/default-profile.png"
                alt="Profile"
              />
            </label>
            <input
              type="file"
              id="profileImage"
              name="profileImage"
              accept="image/*"
              style="display: none"
            />
            <label class="form-label" for="profileImage">Profile image</label>
          </div>

          <div class="form-group">
            <label class="form-label" for="firstname">First-name</label>
            <input
              type="text"
              id="firstname"
              name="firstname"
              class="form-input"
              placeholder="Enter your first-name"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="middlename">Middle-name</label>
            <input
              type="text"
              id="middlename"
              name="middlename"
              class="form-input"
              placeholder="Enter your Middle-name(Optional)"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="lastname">Last-name</label>
            <input
              type="text"
              id="lastname"
              name="lastname"
              class="form-input"
              placeholder="Enter your Last-name"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="username">User-name</label>
            <input
              type="text"
              id="username"
              name="username"
              class="form-input"
              placeholder="Enter your user name"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="signupEmail">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">Phone</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              class="form-input"
              placeholder="Enter your phone"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="signupPassword">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Create a strong password"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword"
              >Confirm Password</label
            >
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              class="form-input"
              placeholder="Confirm your password"
              required
            />
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="agreeTerms" required />
            <label for="agreeTerms">
              I agree to the <a href="#">Terms of Service</a> and
              <a href="#">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" class="auth-btn">Create Account</button>
        </form>

        <div class="auth-switch">
          Already have an account? <a href="/NewUI/login">Sign in</a>
        </div>
      </div>
    </div>
    <script src="/NewUI/JS/navbar.js"></script>
    <script src="/NewUI/JS/signup.js"></script>
  </body>
</html>
