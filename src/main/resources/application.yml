server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  profiles:
    active: local
  datasource:
    hikari:
      initialization-fail-timeout: -1
    username: root
    password:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
